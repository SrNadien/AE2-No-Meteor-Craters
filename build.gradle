plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}


tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version =minecraft_version + "-" + mod_version + "-" + tag_platform
group = mod_group_id

base {
    archivesName = mod_name 
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    client {
        client()
        systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2nometeorcrates'
    }
    server {
        server()
        programArgument '--nogui'
        systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2nometeorcrates'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name "Modmaven"
        url "https://modmaven.dev/"
    }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"


    // Applied Energistics 2
    // compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // GuideMe
    implementation "org.appliedenergistics:guideme:${guideme_version}"

    // Just Enough Items
    // runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    implementation "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_version            : mod_version,
        mod_name               : mod_name,
        mod_named              : mod_named,
        mod_description        : mod_description,
        mod_license            : mod_license,
        issue_tracker          : issue_tracker,          
        ae2_version            : ae2_version,
        guideme_version        : guideme_version,
        jei_version             : jei_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
