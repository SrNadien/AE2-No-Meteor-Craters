modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${issue_tracker}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_named}"
authors = "${mod_author}"
description = "${mod_description}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/ae2-no-meteor-crates"
logoFile = "logo.png"

[[mixins]]
config = "mixins/ae2nocrater.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2"
type = "required"
versionRange = "${ae2_version_range}"
ordering = "AFTER"
side = "BOTH"
